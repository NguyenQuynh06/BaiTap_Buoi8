<!DOCTYPE html>
<html>
  <head>
    <title>Bài 2</title>
  </head>
  <style>
    .menu {
      display: flex;
      gap: 50px;
      align-items: center;
      margin-left: 15%;
    }
    .menu a {
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      background-color: rgb(202, 105, 138);
      transition: 0.3s;
    }
    .menu a:hover {
      background-color: rgb(139, 72, 95);
    }
    .home a {
      background-color: rgb(20, 209, 209);
    }
    .home a:hover {
      background-color: rgba(25, 139, 139, 0.651);
    }
  </style>
  <body>
    <h2>Nhập vào dãy số (cách nhau bằng dấu phẩy):</h2>
    <input type="text" id="numberInput" placeholder="Ví dụ: 5, 10, 3, 21, 8" />
    <button onclick="findMaxMin()">Tìm số lớn nhất và nhỏ nhất</button>

    <p id="result"></p>

    <script>
      function findMaxMin() {
        const input = document.getElementById("numberInput").value;
        const numberArray = input
          .split(",")
          .map((num) => parseFloat(num.trim()));

        if (numberArray.some(isNaN)) {
          document.getElementById("result").innerText =
            "Vui lòng nhập đúng định dạng số!";
          return;
        }
        const max = Math.max(...numberArray);
        const min = Math.min(...numberArray);
        document.getElementById(
          "result"
        ).innerText = `Số lớn nhất: ${max} | Số nhỏ nhất: ${min}`;
      }
    </script>
    <div class="menu">
      <h1>BÀI TẬP</h1>
      <p><a href="index1_1.html">Bài 1c1</a></p>
      <p><a href="index1_2.html">Bài 1c2</a></p>
      <p><a href="index2.html">Bài 2</a></p>
      <p><a href="index3.html">Bài 3</a></p>
      <p class="home"><a href="index.html">HOME</a></p>
    </div>
  </body>
</html>
