<!DOCTYPE html>
<html>
  <head>
    <title>BUOI 8(9-4)</title>
    <style>
      body {
        font-family: Calibri, sans-serif;
        margin: 100px 300px 100px 300px;
      }
      h1 {
        border: 2px solid lightpink;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
        font-size: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        background-color: palevioletred;
      }
      p {
        border: 2px solid lightgray;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        background-color: white;
      }
      a {
        color: palevioletred;
        text-decoration: none;
        position: relative;
        display: inline-block;
      }

      a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 0;
        height: 2px;
        background-color: palevioletred;
        transition: width 0.3s ease-in-out;
      }

      a:hover::after {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>BÀI TẬP</h1>

    <p><a href="index1_2.html">Bài 1c2</a></p>

    <p><a href="index3.html">Bài 3</a></p>
  </body>
</html>
